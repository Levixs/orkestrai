services:
  relay:
    build:
      context: ../..
      dockerfile: packages/orkestrai-relay/Dockerfile
    image: orkestrai-relay:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ORKESTRAI_RELAY_ALLOWED_ORIGINS: ${ORKESTRAI_RELAY_ALLOWED_ORIGINS:-https://orkestrai.app,https://www.orkestrai.app}
    ports:
      - "${RELAY_BIND_IP:?Set RELAY_BIND_IP to the droplet private IP}:8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
