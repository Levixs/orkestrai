name: Bug report
description: Report a reproducible problem in Orkestrai
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private security advisory form instead.
  - type: input
    id: version
    attributes:
      label: Orkestrai version
      placeholder: 0.1.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, credentials, private paths, prompts, and workspace data before attaching anything.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
