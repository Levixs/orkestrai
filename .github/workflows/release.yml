name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.6.2'
  NODE_OPTIONS: '--max-old-space-size=6144'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Match tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    needs: validate
    runs-on: macos-15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-electron-

      - name: Install dependencies
        run: |
          npm install --global npm@$NPM_VERSION
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Package macOS installers
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*-mac.zip
            release/*-mac.zip.blockmap
            release/latest-mac.yml

  build-windows:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-electron-

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --global npm@$env:NPM_VERSION
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Rebuild Electron native dependency
        run: npm run electron:rebuild

      - name: Package Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never "-c.npmRebuild=false"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-linux:
    name: Build Linux (x64)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install dependencies
        run: |
          npm install --global npm@$NPM_VERSION
          npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/latest-linux.yml

  publish:
    name: Publish verified release
    needs: [validate, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release validator dependencies
        run: |
          npm install --global npm@$NPM_VERSION
          npm ci --no-audit --no-fund --ignore-scripts

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate installers and update manifests
        run: node scripts/validate-release-artifacts.mjs release "${{ needs.validate.outputs.version }}"

      - name: Prepare release notes
        run: node scripts/release-notes.mjs "${{ needs.validate.outputs.version }}" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"

      - name: Publish to public releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing RELEASES_TOKEN secret"
            exit 1
          fi

          REPOSITORY="beeblock/orkestrai-releases"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Release $TAG is already public and will not be mutated"
              exit 1
            fi
            gh release edit "$TAG" --repo "$REPOSITORY" --title "Orkestrai $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --repo "$REPOSITORY" --target main --draft \
              --title "Orkestrai $VERSION" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" release/* --repo "$REPOSITORY" --clobber

          LOCAL_COUNT="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          REMOTE_COUNT="$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$LOCAL_COUNT" != "$REMOTE_COUNT" ]]; then
            echo "::error::Release asset count mismatch: local=$LOCAL_COUNT remote=$REMOTE_COUNT"
            exit 1
          fi

          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$REPOSITORY" --json url --jq .url
